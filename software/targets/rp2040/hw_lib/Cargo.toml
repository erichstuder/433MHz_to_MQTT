[package]
name = "hw_lib"
version = "0.0.0" # Versioning is done automatically. This is just a placeholder.
edition = "2024"

[dependencies]
lib = { version = "0.0.0", path = "../../../lib" }
embassy-rp = { version = "=0.10.0", features = ["defmt", "rp2040", "critical-section-impl"] }
embassy-executor = { version = "=0.10.0", features = ["platform-cortex-m", "executor-thread"] }
cortex-m-rt = "=0.7.5"

defmt = "=1.1.0"
defmt-rtt = "=1.2.0"
# panic-probe = { version = "=1.0.0", features = ["print-defmt"] }



[dev-dependencies]
# embedded-test = { version = "=0.7.1", default-features=false }
embedded-test = "=0.7.1"

# TODO: necessary?
# defmt-rtt = "=1.2.0"
# panic-probe = { version = "=1.0.0", features = ["print-defmt"] }

[lib]
harness = false

