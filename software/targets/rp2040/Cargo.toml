[package]
name = "firmware"
version = "0.0.0" # Versioning is done automatically. This is just a placeholder.
edition = "2024"

[dependencies]
lib = { version = "=0.0.0", path = "../../lib" }
embassy-rp = { version = "=0.10.0", features = ["defmt", "rp2040", "critical-section-impl"] }
embassy-executor = { version = "=0.10.0", features = ["executor-thread"], optional = true }
cortex-m-rt = "=0.7.5"

defmt = "=1.1.0"
defmt-rtt = "=1.2.0"
panic-probe = { version = "=1.0.0", features = ["print-defmt"] }

# see: https://docs.rs/embedded-test-linker-script/0.1.0/embedded_test_linker_script/
embedded-test-linker-script = { version = "=0.1.0", optional = true }
embedded-test = { version = "=0.7.1", default-features = false, features = ["embassy-010"], optional = true }

[lib]
harness = false

[[bin]]
name = "firmware"
path = "src/main.rs"
test = false

[features]
default = [
    "embassy-executor/platform-cortex-m",
    "embedded-test-linker-script",
]
host-test = [
    "embassy-executor/platform-std",
    "embedded-test/std",
]
target-test = [
    "embassy-executor/platform-cortex-m",
    "embedded-test/default",
]
